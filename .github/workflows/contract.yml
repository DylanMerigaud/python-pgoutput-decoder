name: contract

# The PyPI release against the newest PostgreSQL servers, every week: the published package,
# installed fresh, runs the live tests (every capture scenario compared with test_decoding, the
# psycopg2 streaming path, the SQL path with psycopg2 and psycopg 3). A server release that
# changes the pgoutput wire format turns this workflow red the week it ships.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["latest", "18", "17", "14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Start PostgreSQL ${{ matrix.postgres }}
        run: |
          docker pull postgres:${{ matrix.postgres }}
          docker run -d --name pg -p 5432:5432 -e POSTGRES_HOST_AUTH_METHOD=trust \
            postgres:${{ matrix.postgres }} \
            -c wal_level=logical -c max_prepared_transactions=10 -c max_replication_slots=20
          for i in $(seq 1 60); do
            docker exec pg pg_isready -U postgres && break
            sleep 1
          done
          docker exec pg postgres --version
      - name: Install the PyPI release
        run: |
          python -m venv "$RUNNER_TEMP/published"
          "$RUNNER_TEMP/published/bin/pip" install --upgrade --no-cache-dir pgoutput pytest \
            psycopg2-binary "psycopg[binary]"
          "$RUNNER_TEMP/published/bin/pip" show pgoutput
      - name: Live contract tests
        env:
          PGOUTPUT_TEST_DSN: "host=127.0.0.1 port=5432 user=postgres dbname=postgres"
        run: |
          # Run the tests against the installed release, not the checkout.
          mv pgoutput "$RUNNER_TEMP/source-pgoutput"
          "$RUNNER_TEMP/published/bin/python" -m pytest -q -p no:cacheprovider tests/integration
